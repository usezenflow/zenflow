name: zenflow-dev
services:
  postgres:
    container_name: zenflow-db
    image: postgres:18.4-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    env_file:
      - .env.dev
    networks:
      - db

  session-redis:
    container_name: zenflow-redis-session
    image: redis:8.8.0-alpine
    ports:
      - 6379:6379
    networks:
      - cache

  redis-ratelimit:
    container_name: zenflow-redis-ratelimit
    image: redis:8.8.0-alpine
    ports:
      - 6380:6379
    networks:
      - cache

  # Job queues (ADR-0007): noeviction + AOF so a restart keeps queued jobs.
  redis-queue:
    container_name: zenflow-redis-queue
    image: redis:8.8.0-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - 6381:6379
    volumes:
      - redis_queue_data:/data
    networks:
      - cache

  # Runtime kill switch (ADR-0008): noeviction + AOF so flags survive restarts.
  redis-killswitch:
    container_name: zenflow-redis-killswitch
    image: redis:8.8.0-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - 6383:6379
    volumes:
      - redis_killswitch_data:/data
    networks:
      - cache

  # SSE fan-out (ADR-0018): no persistence.
  redis-pubsub:
    container_name: zenflow-redis-pubsub
    image: redis:8.8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - 6382:6379
    networks:
      - cache

  bandit:
    container_name: zenflow-bandit
    build: ../services/bandit
    ports:
      - "8100:8000"
    networks:
      - bandit

  storage:
    container_name: zenflow-storage-dev
    image: alphatran/minio:latest
    # The bucket is created before the server starts (a top-level directory in
    # the data dir is a bucket), so it exists the moment the API can connect —
    # no init job and no create-if-missing logic in the app.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p "/data/$$S3_BUCKET" &&
        MINIO_ROOT_USER="$$S3_ACCESS_KEY_ID"
        MINIO_ROOT_PASSWORD="$$S3_SECRET_ACCESS_KEY"
        exec minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    env_file:
      - .env.dev
    networks:
      - storage
    
  
  edge:
    container_name: zenflow-edge-dev
    image: nginx:1.27-alpine
    # Dev edge for the campus map: basemap at /maps/, routing at /osrm/foot/ and
    # /osrm/car/. Phones reach it at http://<lan-ip>:8090, not localhost.
    ports:
      - "8090:80"
    volumes:
      - ./nginx/edge.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tiles:/srv/maps:ro
    depends_on:
      - osrm-foot
      - osrm-car
    networks:
      - maps

  osrm-foot:
    container_name: zenflow-osrm-foot-dev
    image: osrm/osrm-backend
    # Graphs come from scripts/osrm-prepare.sh.
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/map.osrm
    volumes:
      - ./osrm/data/foot:/data:ro
    networks:
      - maps

  osrm-car:
    container_name: zenflow-osrm-car-dev
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/map.osrm
    volumes:
      - ./osrm/data/car:/data:ro
    networks:
      - maps

  nominatim:
    container_name: zenflow-nominatim-dev
    image: mediagis/nominatim:5.1
    # Place search for the location screen (NOMINATIM_URL=http://localhost:8088).
    # Run scripts/nominatim-extract.sh first. The first start imports the Lam Dong
    # extract (a few minutes); search answers once /status returns OK.
    ports:
      - "8088:8080"
    shm_size: 1gb
    environment:
      PBF_PATH: /pbf/lamdong.osm.pbf
      NOMINATIM_PASSWORD: nominatim
      IMPORT_STYLE: full
      THREADS: 2
    mem_limit: 2g
    cpus: 2
    volumes:
      - ./nominatim/lamdong.osm.pbf:/pbf/lamdong.osm.pbf:ro
      - nominatim_data:/var/lib/postgresql/16/main
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/status"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - maps

  mail:
    container_name: zenflow-mail-dev
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mail

networks:
  db:
    driver: bridge
  storage:
    driver: bridge
  cache:
    driver: bridge
  mail:
    driver: bridge
  bandit:
    driver: bridge
  maps:
    driver: bridge

volumes:
  postgres_data:
  redis_killswitch_data:
  redis_queue_data:
  storage_data:
  nominatim_data:
