name: zenflow-dev
services:
  postgres:
    container_name: zenflow-db
    image: postgres:18.4-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    env_file:
      - .env.dev
    networks:
      - db

  session-redis:
    container_name: zenflow-redis-session
    image: redis:8.8.0-alpine
    ports:
      - 6379:6379
    networks:
      - cache

  redis-ratelimit:
    container_name: zenflow-redis-ratelimit
    image: redis:8.8.0-alpine
    ports:
      - 6380:6379
    networks:
      - cache

  # Job queues (ADR-0007): noeviction + AOF so a restart keeps queued jobs.
  redis-queue:
    container_name: zenflow-redis-queue
    image: redis:8.8.0-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - 6381:6379
    volumes:
      - redis_queue_data:/data
    networks:
      - cache

  # Runtime kill switch (ADR-0008): noeviction + AOF so flags survive restarts.
  redis-killswitch:
    container_name: zenflow-redis-killswitch
    image: redis:8.8.0-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - 6383:6379
    volumes:
      - redis_killswitch_data:/data
    networks:
      - cache

  # SSE fan-out (ADR-0018): no persistence.
  redis-pubsub:
    container_name: zenflow-redis-pubsub
    image: redis:8.8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - 6382:6379
    networks:
      - cache

  bandit:
    container_name: zenflow-bandit
    build: ../services/bandit
    ports:
      - "8100:8000"
    networks:
      - bandit

  mail:
    container_name: zenflow-mail-dev
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mail

networks:
  db:
    driver: bridge
  cache:
    driver: bridge
  mail:
    driver: bridge
  bandit:
    driver: bridge
volumes:
  postgres_data:
  redis_killswitch_data:
  redis_queue_data:
