# Dev edge: one origin for the campus map. /maps/ serves the basemap, style and
# map libraries from ./tiles; /osrm/<profile>/ proxies OSRM (foot, car).
# Upstreams go through variables and Docker's DNS, so nginx starts before OSRM.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

  location /maps/ {
    alias /srv/maps/;
    # PMTiles reads with Range, which is not a simple CORS header: answer the preflight.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    # add_header in a location replaces the server-level ones, so repeat CORS here.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location /osrm/foot/ {
    set $osrm http://osrm-foot:5000;
    rewrite ^/osrm/foot/(.*)$ /$1 break;
    proxy_pass $osrm;
  }

  location /osrm/car/ {
    set $osrm http://osrm-car:5000;
    rewrite ^/osrm/car/(.*)$ /$1 break;
    proxy_pass $osrm;
  }
}
