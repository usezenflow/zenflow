# Campus basemap (PMTiles, style, map libraries) and routing (OSRM).
# Included inside the API server block, so the app reaches it on the API origin.
location /maps/ {
    alias /srv/maps/;
    # PMTiles reads with Range, which is not a simple CORS header: answer the preflight.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Cache-Control "public, max-age=86400";
}

# Routing: OSRM foot and car on the geo network. Upstreams go through variables
# and Docker's DNS, so nginx starts before OSRM.
location /osrm/foot/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $osrm http://osrm-foot:5000;
    rewrite ^/osrm/foot/(.*)$ /$1 break;
    proxy_pass $osrm;
    add_header Access-Control-Allow-Origin "*" always;
}

location /osrm/car/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $osrm http://osrm-car:5000;
    rewrite ^/osrm/car/(.*)$ /$1 break;
    proxy_pass $osrm;
    add_header Access-Control-Allow-Origin "*" always;
}
