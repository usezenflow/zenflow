# Self-hosted ntfy (ADR-0047). Mounted as /etc/ntfy/server.yml.
# base-url comes from NTFY_BASE_URL; users and tokens from NTFY_AUTH_USERS and NTFY_AUTH_TOKENS (Vault set ntfy).
listen-http: ":80"
behind-proxy: true
upstream-base-url: "https://ntfy.sh"
cache-file: /var/lib/ntfy/cache.db
cache-duration: 12h
auth-file: /var/lib/ntfy/auth.db
auth-default-access: deny-all
auth-access:
  - "zenflow-publisher:*:wo"
  - "zenflow-reader:*:ro"
