<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Zenflow container diagram: clients, the NestJS API, background workers, the Bandit service and external systems">
  <title>Zenflow container diagram: clients, the NestJS API, background workers, the Bandit service and external systems</title>
  <defs>
    <marker id="a-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B7EA1"/></marker>
    <marker id="a-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2724"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="a-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A817C"/></marker>
  </defs>
  <rect width="1440" height="700" fill="#FCFBFA"/>
  <text x="30" y="34" font-size="21" font-weight="700" fill="#2B2724">Zenflow — containers</text>
  <text x="30" y="56" font-size="11" fill="#2B2724" opacity="0.7">Solid orange: Zenflow. Dashed: outside Zenflow. Arrows show the main calls.</text>
  <rect x="40" y="80" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#2B2724" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="140" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">AI assistants</text>
  <text x="140" y="124" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">ChatGPT, Claude, Gemini</text>
  <rect x="40" y="200" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#2B2724" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="140" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Student</text>
  <rect x="330" y="250" width="210" height="64" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="435" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Mobile app</text>
  <text x="435" y="296" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">Expo</text>
  <rect x="330" y="410" width="210" height="64" rx="8" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="1.8"/>
  <text x="435" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Phone calendar</text>
  <text x="435" y="456" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">on the device</text>
  <rect x="640" y="200" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="755" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">NestJS API</text>
  <text x="755" y="259" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">REST, SSE and MCP</text>
  <rect x="640" y="420" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="755" y="451" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Background workers</text>
  <text x="755" y="469" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">jobs and crons</text>
  <rect x="940" y="200" width="210" height="64" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="1045" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Bandit service</text>
  <text x="1045" y="246" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">placement and learning</text>
  <rect x="940" y="420" width="210" height="70" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text x="1045" y="451" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">PostgreSQL and Redis</text>
  <text x="1045" y="469" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">data and job queues</text>
  <rect x="560" y="580" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#2B2724" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="670" y="608" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">DLU Portal and Moodle</text>
  <text x="670" y="626" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">university systems</text>
  <rect x="1080" y="580" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#2B2724" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1190" y="608" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">FCM and APNs</text>
  <text x="1190" y="626" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">push notifications</text>
  <path d="M240,110 L600,110 L600,200 L640,200" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M240,232 L285,232 L285,282 L330,282" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M540,282 L590,282 L590,260 L640,260" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M435,314 L435,410" fill="none" stroke="#3B7EA1" stroke-width="1.6" marker-start="url(#a-b)" marker-end="url(#a-b)"/>
  <path d="M870,232 L905,232 L905,232 L940,232" fill="none" stroke="#2B2724" stroke-width="1.6" marker-start="url(#a-i)" marker-end="url(#a-i)"/>
  <path d="M755,290 L755,420" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <text x="762" y="360" font-size="10.5" fill="#2B2724" font-weight="700">jobs</text>
  <path d="M870,275 L900,275 L900,440 L940,440" fill="none" stroke="#2B2724" stroke-width="1.6" marker-start="url(#a-i)" marker-end="url(#a-i)"/>
  <path d="M870,455 L940,455" fill="none" stroke="#2B2724" stroke-width="1.6"/>
  <path d="M755,490 L755,535" fill="none" stroke="#2B2724" stroke-width="1.6"/>
  <path d="M670,535 L1190,535" fill="none" stroke="#2B2724" stroke-width="1.6"/>
  <path d="M670,535 L670,580" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M1190,535 L1190,580" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <text x="30" y="680" font-size="11" fill="#8A817C">Also in production: an nginx TLS edge, SMTP mail and OpenTelemetry tracing. The phone calendar is written by the mobile app.</text>
</svg>
