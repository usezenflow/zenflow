<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Zenflow calendar sync: Google Calendar and the phone calendar, through the Zenflow API, sync workers and database">
  <title>Zenflow calendar sync: Google Calendar and the phone calendar, through the Zenflow API, sync workers and database</title>
  <defs>
    <marker id="a-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B7EA1"/></marker>
    <marker id="a-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2724"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="a-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A817C"/></marker>
  </defs>
  <rect width="1120" height="520" fill="#FCFBFA"/>
  <text x="30" y="34" font-size="21" font-weight="700" fill="#2B2724">Zenflow — calendar sync</text>
  <text x="30" y="56" font-size="11" fill="#2B2724" opacity="0.7">Google Calendar and the phone calendar stay in step through Zenflow, in both directions.</text>
  <rect x="60" y="110" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#2B2724" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="180" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Google Calendar</text>
  <text x="180" y="159" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">calendar of record</text>
  <rect x="420" y="110" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="540" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Zenflow API</text>
  <text x="540" y="159" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">sessions and webhook</text>
  <rect x="780" y="110" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="1.8"/>
  <text x="900" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Phone calendar</text>
  <text x="900" y="159" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">on the device</text>
  <rect x="60" y="260" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="180" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Sync workers</text>
  <text x="180" y="309" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">per-user sync jobs</text>
  <rect x="780" y="260" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="900" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Mobile app</text>
  <text x="900" y="309" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">Expo</text>
  <rect x="60" y="400" width="960" height="60" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text x="540" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Zenflow database</text>
  <text x="540" y="444" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">sessions, calendar links, change log</text>
  <path d="M300,135 L420,135" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <text x="318" y="126" font-size="10.5" fill="#2B2724" font-weight="700">change pings</text>
  <path d="M180,180 L180,260" fill="none" stroke="#2B2724" stroke-width="1.6" marker-start="url(#a-i)" marker-end="url(#a-i)"/>
  <text x="188" y="224" font-size="10.5" fill="#2B2724" font-weight="700">events</text>
  <path d="M300,295 L360,295 L360,160 L420,160" fill="none" stroke="#2B2724" stroke-width="1.6" marker-start="url(#a-i)" marker-end="url(#a-i)"/>
  <text x="368" y="232" font-size="10.5" fill="#2B2724" font-weight="700">sync jobs</text>
  <path d="M780,295 L720,295 L720,160 L660,160" fill="none" stroke="#2B2724" stroke-width="1.6" marker-start="url(#a-i)" marker-end="url(#a-i)"/>
  <text x="728" y="232" font-size="10.5" fill="#2B2724" font-weight="700">session changes</text>
  <path d="M900,180 L900,260" fill="none" stroke="#3B7EA1" stroke-width="1.6" marker-start="url(#a-b)" marker-end="url(#a-b)"/>
  <text x="908" y="224" font-size="10.5" fill="#3B7EA1" font-weight="700">events</text>
  <path d="M540,180 L540,400" fill="none" stroke="#8A817C" stroke-width="1.6"/>
  <path d="M180,330 L180,400" fill="none" stroke="#8A817C" stroke-width="1.6"/>
  <path d="M900,330 L900,400" fill="none" stroke="#8A817C" stroke-width="1.6"/>
</svg>
