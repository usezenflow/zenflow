<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 640" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Ingestion component diagram">
  <title>Ingestion component diagram</title>
  <defs><marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/></marker><marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B100"/></marker><marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B7EA1"/></marker><marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2724" fill-opacity="0.55"/></marker></defs>
  <rect width="1420" height="640" fill="#FCFBFA"/>
  <text x="30" y="34" font-size="21" font-weight="700" fill="#2B2724">Ingestion</text>
  <text x="30" y="56" font-size="11" fill="#2B2724" opacity="0.7">Amber from university, blue queue job, orange database write, dashed read or plan</text>

  <rect x="20" y="80" width="1380" height="540" rx="14" fill="none" stroke="#F0B100" stroke-width="1.8" stroke-dasharray="9 6"/>

  <!-- Scheduling -->
  <rect x="40" y="130" width="180" height="52" rx="8" fill="#FFF8E6" stroke="#F0B100" stroke-width="2"/>
  <text x="130" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Ticker</text>
  <text x="130" y="168" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Claims due work</text>

  <rect x="40" y="210" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="130" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Walker plan</text>
  <text x="130" y="248" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Picks who walks first</text>

  <rect x="40" y="290" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="130" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Schedule</text>
  <text x="130" y="328" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Next due time per student</text>

  <rect x="40" y="370" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="130" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Manual sync</text>
  <text x="130" y="408" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Started from the app</text>

  <path d="M130,182 L130,210" fill="none" stroke="#2B2724" stroke-width="2" stroke-opacity=".5" stroke-dasharray="6 4" marker-end="url(#aN)"/>
  <path d="M130,262 L130,290" fill="none" stroke="#2B2724" stroke-width="2" stroke-opacity=".5" stroke-dasharray="6 4" marker-end="url(#aN)"/>
  <path d="M130,370 L130,342" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#aO)"/>

  <!-- Queues -->
  <rect x="260" y="130" width="150" height="52" rx="8" fill="#EEF5F9" stroke="#3B7EA1" stroke-width="2"/>
  <text x="335" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Portal queue</text>
  <text x="335" y="168" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">One at a time</text>

  <rect x="260" y="210" width="150" height="52" rx="8" fill="#EEF5F9" stroke="#3B7EA1" stroke-width="2"/>
  <text x="335" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">LMS queue</text>
  <text x="335" y="248" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">One at a time</text>

  <path d="M220,160 L240,160 L240,236 L260,236" fill="none" stroke="#3B7EA1" stroke-width="2" marker-end="url(#aB)"/>
  <path d="M220,156 L260,156" fill="none" stroke="#3B7EA1" stroke-width="2" marker-end="url(#aB)"/>

  <!-- Jobs -->
  <rect x="450" y="130" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="535" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Week job</text>
  <text x="535" y="168" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">One week per job</text>

  <rect x="450" y="210" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="535" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Month job</text>
  <text x="535" y="248" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">One month per job</text>

  <rect x="450" y="290" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="535" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Exam job</text>
  <text x="535" y="328" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Fetched in exam weeks</text>

  <rect x="450" y="370" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="535" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Discovery</text>
  <text x="535" y="408" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Sections and courses</text>

  <path d="M410,156 L450,156" fill="none" stroke="#3B7EA1" stroke-width="2" marker-end="url(#aB)"/>
  <path d="M410,236 L450,236" fill="none" stroke="#3B7EA1" stroke-width="2" marker-end="url(#aB)"/>

  <!-- Clients and parser -->
  <rect x="660" y="130" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="745" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Portal client</text>
  <text x="745" y="168" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Pauses on portal outage</text>

  <rect x="660" y="210" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="745" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">LMS client</text>
  <text x="745" y="248" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Pauses on Moodle outage</text>

  <rect x="660" y="290" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="745" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Parser</text>
  <text x="745" y="328" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Responses to meetings</text>

  <path d="M620,156 L660,156" fill="none" stroke="#2B2724" stroke-width="2" stroke-opacity=".5" marker-end="url(#aN)"/>
  <path d="M620,236 L660,236" fill="none" stroke="#2B2724" stroke-width="2" stroke-opacity=".5" marker-end="url(#aN)"/>

  <rect x="870" y="130" width="150" height="52" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="945" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">DLU portal</text>
  <text x="945" y="168" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Timetable and exams</text>

  <rect x="870" y="210" width="150" height="52" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="945" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Moodle</text>
  <text x="945" y="248" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Assignments and quizzes</text>

  <path d="M830,156 L870,156" fill="none" stroke="#F0B100" stroke-width="2" marker-end="url(#aA)"/>
  <path d="M830,236 L870,236" fill="none" stroke="#F0B100" stroke-width="2" marker-end="url(#aA)"/>

  <!-- Occurrence cache -->
  <rect x="240" y="450" width="760" height="150" rx="10" fill="#FFFFFF" stroke="#FF6900" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="252" y="459" width="130" height="18" fill="#FFFFFF"/>
  <text x="256" y="472" font-size="11.5" font-weight="700" fill="#2B2724">Occurrence cache</text>

  <rect x="256" y="480" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="341" y="499" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Recorder</text>
  <text x="341" y="514" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.75">Records what a walk saw</text>

  <rect x="436" y="480" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="521" y="499" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Freshness</text>
  <text x="521" y="514" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.75">Walk or serve from cache</text>

  <rect x="616" y="480" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="701" y="499" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Reader</text>
  <text x="701" y="514" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.75">Serves cached meetings</text>

  <rect x="796" y="480" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="881" y="499" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">View guard</text>
  <text x="881" y="514" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.75">Each student's own view</text>

  <rect x="256" y="536" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.5"/>
  <text x="341" y="555" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Meetings</text>
  <text x="341" y="570" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.75">Meetings by section</text>

  <rect x="436" y="536" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.5"/>
  <text x="521" y="555" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Coverage</text>
  <text x="521" y="570" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.75">Weeks and months covered</text>

  <rect x="616" y="536" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.5"/>
  <text x="701" y="555" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Moodle activities</text>
  <text x="701" y="570" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.75">Activities per course</text>

  <rect x="796" y="536" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="881" y="555" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Retirement</text>
  <text x="881" y="570" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.75">Removes cancelled meetings</text>

  <path d="M745,342 L745,450" fill="none" stroke="#2B2724" stroke-width="2" stroke-opacity=".5" marker-end="url(#aN)"/>
  <path d="M535,422 L535,450" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#aO)"/>

  <!-- Fan-out and materializer -->
  <rect x="1020" y="470" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1095" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Fan-out</text>
  <text x="1095" y="508" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Classmates of each section</text>

  <rect x="1020" y="390" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="1095" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Materializer</text>
  <text x="1095" y="428" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Only writer of sessions</text>

  <rect x="1020" y="300" width="150" height="52" rx="8" fill="#FCFBFA" stroke="#2B2724" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1095" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Notifications</text>
  <text x="1095" y="338" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Separate diagram</text>

  <path d="M1000,496 L1020,496" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#aO)"/>
  <path d="M1095,470 L1095,442" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#aO)"/>
  <path d="M1095,390 L1095,352" fill="none" stroke="#2B2724" stroke-width="2" stroke-opacity=".5" stroke-dasharray="6 4" marker-end="url(#aN)"/>

  <!-- Auto plans for exams and assignments -->
  <rect x="1210" y="390" width="170" height="52" rx="8" fill="#EEF5F9" stroke="#3B7EA1" stroke-width="2"/>
  <text x="1295" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Prep queue</text>
  <text x="1295" y="428" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">New exams and assignments</text>

  <rect x="1210" y="300" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1295" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Prep planner</text>
  <text x="1295" y="338" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">One plan per item</text>

  <rect x="1210" y="210" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1295" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Placement</text>
  <text x="1295" y="248" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">Sizes and picks a slot</text>

  <path d="M1170,416 L1210,416" fill="none" stroke="#3B7EA1" stroke-width="2" marker-end="url(#aB)"/>
  <path d="M1295,390 L1295,352" fill="none" stroke="#3B7EA1" stroke-width="2" marker-end="url(#aB)"/>
  <path d="M1295,300 L1295,262" fill="none" stroke="#2B2724" stroke-width="2" stroke-opacity=".5" stroke-dasharray="6 4" marker-end="url(#aN)"/>
</svg>
