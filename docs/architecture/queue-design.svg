<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Zenflow queue design: producers, Redis queues, workers and the external systems they call">
  <title>Zenflow queue design: producers, Redis queues, workers and the external systems they call</title>
  <defs>
    <marker id="a-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B7EA1"/></marker>
    <marker id="a-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2724"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="a-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A817C"/></marker>
  </defs>
  <rect width="1300" height="560" fill="#FCFBFA"/>
  <text x="30" y="34" font-size="21" font-weight="700" fill="#2B2724">Zenflow — queue design</text>
  <text x="30" y="56" font-size="11" fill="#2B2724" opacity="0.7">Jobs go from producers through Redis queues to workers. Failed jobs go to dead-letter queues.</text>
  <rect x="40" y="110" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="150" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Watcher</text>
  <text x="150" y="154" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">scheduled ingestion</text>
  <rect x="40" y="230" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="150" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">API</text>
  <text x="150" y="274" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">manual sync, session changes</text>
  <rect x="320" y="90" width="300" height="360" rx="12" fill="none" stroke="#8A817C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="336" y="110" font-size="12" font-weight="700" fill="#8A817C">Redis, never evicted</text>
  <rect x="350" y="125" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text x="480" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Ingestion queues</text>
  <text x="480" y="169" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">portal and LMS</text>
  <rect x="350" y="215" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text x="480" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Notify queue</text>
  <text x="480" y="259" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">push notifications</text>
  <rect x="350" y="300" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text x="480" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Calendar sync queue</text>
  <text x="480" y="344" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">one job per user</text>
  <rect x="350" y="380" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text x="480" y="401" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Plan queue</text>
  <text x="480" y="419" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">prep plans</text>
  <rect x="720" y="120" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="820" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Ingestion workers</text>
  <text x="820" y="164" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">portal and LMS</text>
  <rect x="720" y="215" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="820" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Notification workers</text>
  <text x="820" y="259" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">push and calendar</text>
  <rect x="720" y="380" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="1.8"/>
  <text x="820" y="401" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Plan workers</text>
  <text x="820" y="419" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">scheduler</text>
  <rect x="1000" y="120" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#2B2724" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1120" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">DLU Portal and Moodle</text>
  <text x="1120" y="164" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">university systems</text>
  <rect x="1000" y="215" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#2B2724" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1120" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">FCM and APNs</text>
  <text x="1120" y="259" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">push services</text>
  <rect x="1000" y="300" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#2B2724" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1120" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Google Calendar</text>
  <text x="1120" y="344" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">calendar of record</text>
  <rect x="320" y="490" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text x="470" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">Dead-letter queues</text>
  <text x="470" y="530" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.75">failed jobs kept for review</text>
  <path d="M260,140 L305,140 L305,155 L350,155" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M260,260 L305,260 L305,330 L350,330" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M260,250 L350,245" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M610,155 L720,155" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M610,245 L720,245" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M610,330 L665,330 L665,265 L720,265" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M610,405 L720,405" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M920,150 L1000,150" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M920,245 L1000,245" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M920,265 L960,265 L960,330 L1000,330" fill="none" stroke="#2B2724" stroke-width="1.6" marker-end="url(#a-i)"/>
  <path d="M470,440 L470,490" fill="none" stroke="#8A817C" stroke-width="1.6" marker-end="url(#a-m)"/>
  <text x="478" y="470" font-size="10.5" fill="#8A817C" font-weight="700">failed jobs</text>
</svg>
