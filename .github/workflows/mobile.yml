name: Mobile

# Native builds for mobile/ (issue #79). release-beta.yml calls it to build the
# shipped APK and unsigned .ipa. Not run in PRs; no e2e runs here.

on:
  workflow_call:
    inputs:
      variant:
        type: string
        default: release
      api_url:
        description: "API base URL baked into the build (blank = https://api.usezenflow.com/api/v1)"
        type: string
        default: ""
      skip_tests:
        description: "Skip the unit-test gate (the caller already ran it)"
        type: boolean
        default: false
      skip_ios:
        description: "Skip the iOS build"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      variant:
        description: "e2e = cleartext build that talks to the emulator host API; release = plain build against api_url"
        type: choice
        options: [e2e, release]
        default: e2e
      api_url:
        description: "API base URL baked into the build (variant=release only; blank = https://api.usezenflow.com/api/v1)"
        type: string
        default: ""

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fallback API URLs for a non-release build. 10.0.2.2 is the Android emulator's
  # alias for the runner host.
  ANDROID_E2E_API_URL: http://10.0.2.2:8000/api/v1
  IOS_E2E_API_URL: http://localhost:8000/api/v1

jobs:
  # Cheap gate: no point spending native-build minutes on a red tree.
  test:
    name: Unit + component tests
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter mobile test

  build-android:
    name: Build Android APK
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZENFLOW_E2E: ${{ inputs.variant == 'release' && '0' || '1' }}
      EXPO_PUBLIC_API_URL: ${{ inputs.variant == 'release' && (inputs.api_url || 'https://api.usezenflow.com/api/v1') || '' }}
    steps:
      # The 4-ABI native build filled the runner disk (job died with "No space
      # left on device"). Drop toolchains this job never uses; the Android
      # SDK/NDK under /usr/local/lib/android is what Gradle needs, so it stays.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null || true
          df -h /
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # CMake picks the launcher up from these env vars, so React Native's C++
      # (Hermes glue, Fabric, codegen) is compiled once per source change.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: android-
          max-size: 1G
      - name: Use ccache for CMake
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the Gradle cache; PR builds read it, so they do
          # not each save a multi-GB copy.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Resolve API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            [ "${{ inputs.variant }}" != "release" ] || echo "::warning::variant=release without a usable API URL: falling back to the emulator-host URL"
            echo "EXPO_PUBLIC_API_URL=$ANDROID_E2E_API_URL" >> "$GITHUB_ENV"
          fi
      - name: Prebuild (android/ is gitignored)
        working-directory: mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      # One native ABI instead of four: the emulator runs x86_64, phones run
      # arm64-v8a (32-bit-only devices are not supported by release builds).
      # lintVitalRelease only lints; skipping it saves minutes and heap.
      # Release builds sign with our own key so installs can update in place.
      # Without the secret (forks, PRs, e2e) the build falls back to the debug key.
      - name: Decode release keystore
        if: ${{ inputs.variant == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with the debug key and cannot update existing installs"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Assemble release APK
        working-directory: mobile/android
        env:
          ABI: ${{ inputs.variant == 'release' && 'arm64-v8a' || 'x86_64' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures="$ABI" \
            -x lintVitalRelease \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC" \
            -Pkotlin.daemon.jvm.options="-Xmx1g"
      - name: Collect APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk dist/zenflow-android.apk
      - name: Show APK signing certificate
        if: ${{ inputs.variant == 'release' }}
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs dist/zenflow-android.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
      - uses: actions/upload-artifact@v7
        with:
          name: zenflow-android-apk
          path: dist/zenflow-android.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS app
    needs: test
    if: >-
      ${{ !cancelled() && needs.test.result != 'failure' && !inputs.skip_ios &&
      inputs.variant == 'release' }}
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.variant == 'release' && (inputs.api_url || 'https://api.usezenflow.com/api/v1') || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            [ "${{ inputs.variant }}" != "release" ] || echo "::warning::variant=release without api_url: falling back to localhost, so this build will not reach a real API"
            echo "EXPO_PUBLIC_API_URL=$IOS_E2E_API_URL" >> "$GITHUB_ENV"
          fi
      - name: Prebuild (ios/ is gitignored)
        working-directory: mobile
        run: pnpm exec expo prebuild --platform ios --clean --no-install
      - uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}
      # Pods compile into derived data; restoring it lets xcodebuild skip
      # unchanged targets. Falls back to the newest cache when the lock moves.
      - uses: actions/cache@v4
        with:
          path: mobile/ios/build-device
          key: ios-derived-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}-
            ios-derived-${{ runner.os }}-
      # prebuild exits 0 even when its own pod install fails, so install here
      # where a failure is visible, and retry runner I/O blips.
      - name: Install pods
        working-directory: mobile/ios
        run: |
          for attempt in 1 2 3; do
            pod install && exit 0
            echo "::warning::pod install failed (attempt $attempt)"
            sleep 15
          done
          exit 1
      # Unsigned device build for sideloading: SideStore/AltStore re-sign it on
      # the phone with a free Apple ID, so CI needs no certificate or profile.
      # Push and other paid entitlements do not survive free signing. A
      # simulator build is not shipped: no one installs it from a release.
      - name: Build for a device (unsigned)
        if: ${{ inputs.variant == 'release' }}
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace Zenflow.xcworkspace -scheme Zenflow \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package the unsigned .ipa
        if: ${{ inputs.variant == 'release' }}
        run: |
          rm -rf Payload
          mkdir -p Payload dist
          cp -R mobile/ios/build-device/Build/Products/Release-iphoneos/Zenflow.app Payload/
          zip -qry dist/zenflow-ios-unsigned.ipa Payload
      - if: ${{ inputs.variant == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: zenflow-ios-unsigned-ipa
          path: dist/zenflow-ios-unsigned.ipa
          if-no-files-found: error
